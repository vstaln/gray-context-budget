[package]
name = "gray-context-budget"
version = "0.1.1"
edition = "2024"
description = "Merged context-budget plugin for the gray agent harness: truncate, compact, cacheopt in one sidecar."
license = "MIT"

[[bin]]
name = "context-budget"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
